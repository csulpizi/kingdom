<!doctype html>
<meta http-equiv="Content-Security-Policy" content="default-src * self">
<html>

<script src="app.js" type="module"></script>

<head>
    <link rel="stylesheet" href="style.css">
    <title>Kingdom</title>
    <link rel="icon" type="image/x-icon" href="favicon.png">
</head>

<body>
    <header class="topbar">
        <span class="brand">Kingdom</span>
    </header>

    <svg class="icon" aria-hidden="true" focusable="false">
        <use href="#i-burn"></use>
    </svg>
    <img class="icon" aria-hidden="true" focusable="false" src="food.svg" color="red"></svg>
    <div class="stats" name="stats">
        <div class="stat">
            Turn
            <span class="cyan-text" name="stat:turn">
                4
            </span>
        </div>
        <div class="stat">
            <img class="stat-icon" src="icons/food.svg">
            Food
            <span class="food-text" name="stat:food">
                4
            </span>
        </div>
        <div class="stat">
            <img class="stat-icon" src="icons/gold.svg">
            Gold
            <span class="gold-text" name="stat:gold">
                4
            </span>
        </div>
        <div class="stat">
            <img class="stat-icon" src="icons/farms.svg" color="green">
            Farms
            <span class="farm-text" name="stat:farms">
                4
            </span>
        </div>
        <div class="stat">
            <img class="stat-icon" src="icons/acres.svg">
            Acres
            <span class="acre-text" name="stat:acres">
                4
            </span>
        </div>
        <div class="stat">
            <img class="stat-icon" src="icons/glory.svg">
            Glory
            <span class="glory-text" name="stat:glory">
                ⬤○○○○
            </span>
        </div>
    </div>
    <div class="container">
        <div class="bar-left" name="main">
            <div class="lands-in-play-grid" name="landsinplay">
            </div>
            <div class="maindisplay" name="maindisplay">
            </div>
        </div>
        <div class="bar-right">
            <div class="logs" name="logs">
            </div>
        </div>
</body>

</html>
